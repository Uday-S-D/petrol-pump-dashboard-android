name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install compatible Gradle
      - name: Install Gradle 9.5.1
        shell: bash
        run: |
          curl -fL \
            https://services.gradle.org/distributions/gradle-9.5.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-9.5.1/bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gradle-9.5.1/bin/gradle" --version

      # 4. Locate Android SDK
      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          find /usr/local/lib/android/sdk/cmdline-tools \
            -maxdepth 3 \
            -name sdkmanager \
            -type f \
            -print

      # 5. Install required Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools \
            -maxdepth 3 \
            -name sdkmanager \
            -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. Verify Android SDK
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ls -la "$ANDROID_SDK_ROOT/platforms"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

      # 7. Build debug APK
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/gradle-9.5.1/bin/gradle" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK_PATH"
          file "$APK_PATH"

      # 9. Upload APK to GitHub Actions artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: petrol-pump-dashboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
