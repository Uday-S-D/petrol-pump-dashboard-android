plugins {
    id 'com.android.application'
}

android {
    namespace 'com.petrolpump.dashboard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.petrolpump.dashboard'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}
